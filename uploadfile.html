<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My website</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section class="hero-banner">
            <div class="banner-content">
                <br><br><br>
                <img src="assets/plotulate.png" width="150" height="150"> 
                <h2>Spreadsheet inference and visualisation tool</h2>
            </div>
        </section>
        <hr><br><br>

        <div id="options_area" class="options_area">
            <button id="openBtn" class="query_button">Query</button><br><br>
            <div id="popupOverlay" class="overlay">
                <div class="popup-box">
                    <h2>Ask your query!</h2>
                    <p>Ask questions about the dataset</p>
                    <form action="submit" id="query_form" method="POST">
                        <div class="query_row">
                            <input type="text" id="userprompt" class="query_field" placeholder="Enter prompt here">
                            <button type="submit" id="promptcall" class="ment">Ask!</button>
                        </div>
                        <p id="llm_response"></p>
                    </form>
                    <button id="closeBtn" class="ment_counter">Close</button>
                </div>
            </div><br>

            <form action="/submit" id="uploadfile" method="POST" class="form_submit" enctype="multipart/form-data">
                <input type="file" id="data" name="file" accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
                <button type="submit" id="uploadfilebutton" class="ment">Upload</button>
            </form>
        </div>
        <br><br>
        <hr>
        <script type="module" src="index.js"></script>
        <div id="myGrid" class="sheet_data"></div>
    </body>
</html>
